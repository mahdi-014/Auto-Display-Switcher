name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Unsigned (win-x64)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AutoDisplaySwitcher.csproj

      - name: Build Project (Release)
        run: dotnet build AutoDisplaySwitcher.csproj -c Release --no-restore

      - name: Publish Self-Contained Single-File (win-x64)
        run: >
          dotnet publish AutoDisplaySwitcher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o publish-output

      - name: Validate Published Files and Stage Unsigned Package
        shell: pwsh
        run: |
          $exePath = "publish-output\AutoDisplaySwitcher.exe"
          $batPath = "Final-Release\AutoDisplaySwitcher.bat"

          if (!(Test-Path $exePath)) {
            Write-Error "Validation failed: AutoDisplaySwitcher.exe does not exist in publish-output."
            exit 1
          }

          $exeItem = Get-Item $exePath
          if ($exeItem.Length -lt 10MB) {
            Write-Error "Validation failed: Executable size ($($exeItem.Length) bytes) is smaller than expected."
            exit 1
          }

          if (!(Test-Path $batPath)) {
            Write-Error "Validation failed: Final-Release\AutoDisplaySwitcher.bat is missing."
            exit 1
          }

          $sig = Get-AuthenticodeSignature $exePath
          if ($sig.Status -eq 'Valid') {
            Write-Error "Unexpected signature state: build-only output should not report Valid without signing step."
            exit 1
          }

          # Stage exactly the two distribution files for archiving
          New-Item -ItemType Directory -Path "stage-unsigned" -Force | Out-Null
          Copy-Item $exePath -Destination "stage-unsigned\AutoDisplaySwitcher.exe" -Force
          Copy-Item $batPath -Destination "stage-unsigned\AutoDisplaySwitcher.bat" -Force

          # Prepare artifact upload directory
          New-Item -ItemType Directory -Path "artifacts" -Force | Out-Null
          $zipPath = "artifacts\AutoDisplaySwitcher-win-x64-unsigned.zip"
          Compress-Archive -Path "stage-unsigned\*" -DestinationPath $zipPath -Force

          # Generate SHA256 checksums for all distributed files (EXE, BAT, and ZIP)
          $filesToHash = @(
            "stage-unsigned\AutoDisplaySwitcher.exe",
            "stage-unsigned\AutoDisplaySwitcher.bat",
            $zipPath
          )
          Get-FileHash -Path $filesToHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))" } |
            Out-File -FilePath "artifacts\checksums-unsigned.sha256" -Encoding ascii

          Write-Host "Artifact Status: UNSIGNED (SignPath Foundation approval pending)"
          Write-Host "Executable Size: $($exeItem.Length) bytes"
          Get-Content "artifacts\checksums-unsigned.sha256"

      # =========================================================================
      # FUTURE SIGNPATH INTEGRATION POINTS (POST-APPROVAL)
      # =========================================================================
      # Current workflow performs truthful unsigned builds only.
      # Once SignPath Foundation approves the project and onboarding completes:
      # 1. Add a dedicated signing job (or post-build stage) gated by repository
      #    approval/environment and official SignPath action
      #    (e.g., SignPath/github-action-submit-signing-request).
      # 2. Configure organization, project, and signing policy identifiers as
      #    repository variables and SIGNPATH_API_TOKEN as a GitHub Environment
      #    secret (never store private keys in the repository or expose secrets).
      # 3. Verify Authenticode signature status == 'Valid' on the returned
      #    binary before naming any package '-signed' or generating signed
      #    SHA256 checksums.
      # =========================================================================

      - name: Upload Unsigned Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoDisplaySwitcher-win-x64-unsigned
          path: artifacts/

  release:
    name: Publish Unsigned GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: release-approval
    permissions:
      contents: write

    steps:
      - name: Download Unsigned Artifacts
        uses: actions/download-artifact@v4
        with:
          name: AutoDisplaySwitcher-win-x64-unsigned
          path: release-files

      - name: Verify Release Tag and Files
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$') {
            Write-Error "Release blocked: invalid or missing semver tag context ($env:GITHUB_REF_TYPE / $env:GITHUB_REF_NAME)."
            exit 1
          }
          if (!(Test-Path "release-files\AutoDisplaySwitcher-win-x64-unsigned.zip") -or !(Test-Path "release-files\checksums-unsigned.sha256")) {
            Write-Error "Required release artifacts are missing from release-files/."
            exit 1
          }
          Get-ChildItem "release-files" | Format-Table Name, Length

      - name: Create Unsigned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/AutoDisplaySwitcher-win-x64-unsigned.zip
            release-files/checksums-unsigned.sha256
          draft: false
          prerelease: true
          generate_release_notes: true
          body: |
            **Artifact Signing Status: UNSIGNED**

            This release is built from repository source via GitHub Actions. Code signing through the SignPath Foundation is currently pending approval.
            Verify `checksums-unsigned.sha256` before use. Do not disable Windows Smart App Control, WDAC, or Code Integrity policies.
